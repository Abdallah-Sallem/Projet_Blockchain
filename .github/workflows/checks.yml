name: FedTrace verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            contracts/package-lock.json
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: npm ci && npm test
        working-directory: contracts
      - run: npm ci && npm run build && npm test
        working-directory: frontend
      - run: python -m scripts.scenarios
      - run: python -m fedtrace.cli demo --rounds 2 > runtime/ci-demo.json
      - run: python -m fedtrace.cli serve > runtime/server-ci.log 2>&1 &
      - run: npx playwright install --with-deps chromium && npx playwright test
        working-directory: frontend
        env:
          FEDTRACE_PYTHON: python
